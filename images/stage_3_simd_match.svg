<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="100%" height="100%" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111a2c"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f2942"/>
      <stop offset="100%" stop-color="#0d3530"/>
    </linearGradient>
    <marker id="mC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="mG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker>
    <marker id="mS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/></marker>
  </defs>

  <!-- Canvas -->
  <rect width="1080" height="640" rx="14" fill="url(#bg)" stroke="#263449" stroke-width="2"/>

  <!-- Header + 6-Stage Stepper -->
  <rect x="20" y="16" width="1040" height="64" rx="10" fill="url(#hdr)" stroke="#2a4365" stroke-width="1.2"/>
  <circle cx="48" cy="48" r="15" fill="#0284c7"/><text x="48" y="54" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">3</text>
  <text x="74" y="43" fill="#f8fafc" font-size="18.5" font-weight="700">Stage 3 · Asking All 16 Board Tiles at Once (SIMD Match)</text>
  <text x="74" y="64" fill="#94a3b8" font-size="12">For active path #45 "CA", ask every tile on the board "Is your letter in {B, R, T}?" simultaneously in 4 vector steps.</text>

  <!-- 6-Stage Progress Stepper -->
  <g transform="translate(836, 37)" font-size="11" font-weight="700" text-anchor="middle">
    <line x1="12" y1="11" x2="188" y2="11" stroke="#334155" stroke-width="2"/>
    <circle cx="12" cy="11" r="10" fill="#0c2f4f" stroke="#38bdf8"/><text x="12" y="15" fill="#7dd3fc">1</text>
    <circle cx="47" cy="11" r="10" fill="#2b1b08" stroke="#fbbf24"/><text x="47" y="15" fill="#fde68a">2</text>
    <circle cx="82" cy="11" r="11" fill="#0284c7" stroke="#bae6fd" stroke-width="1.6"/><text x="82" y="15" fill="#fff">3</text>
    <circle cx="117" cy="11" r="10" fill="#172133" stroke="#475569"/><text x="117" y="15" fill="#64748b">4</text>
    <circle cx="152" cy="11" r="10" fill="#172133" stroke="#475569"/><text x="152" y="15" fill="#64748b">5</text>
    <circle cx="187" cy="11" r="10" fill="#172133" stroke="#475569"/><text x="187" y="15" fill="#64748b">6</text>
  </g>

  <!-- =================================================================== -->
  <!-- TOP BAND: OPEN DICTIONARY PAGE #45 ("CA") — 8 BYTES                 -->
  <!-- =================================================================== -->
  <rect x="20" y="92" width="1040" height="148" rx="10" fill="#0d1526" stroke="#1f2f46" stroke-width="1.2"/>
  <text x="38" y="114" fill="#7dd3fc" font-size="13" font-weight="700">A. Open Dictionary Page #45 ("CA") — fits in 8 bytes</text>

  <!-- Mini tree (x=42..268) -->
  <g transform="translate(44, 126)" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">
    <circle cx="32" cy="48" r="27" fill="#0284c7" stroke="#bae6fd" stroke-width="2"/>
    <text x="32" y="44" fill="#e0f2fe" font-size="11.5">#45</text>
    <text x="32" y="60" fill="#fff" font-size="13">"CA"</text>

    <line x1="57" y1="36" x2="104" y2="14" stroke="#64748b" stroke-width="1.8"/>
    <rect x="104" y="0" width="114" height="26" rx="5" fill="#172133" stroke="#475569"/><text x="161" y="17" fill="#cbd5e1" font-size="11">#100 CAB ★</text>

    <line x1="59" y1="48" x2="104" y2="48" stroke="#34d399" stroke-width="2"/>
    <rect x="104" y="35" width="114" height="26" rx="5" fill="#0b2e26" stroke="#34d399"/><text x="161" y="52" fill="#ecfdf5" font-size="11">#101 CAR ★</text>

    <line x1="57" y1="60" x2="104" y2="82" stroke="#34d399" stroke-width="2"/>
    <rect x="104" y="70" width="114" height="26" rx="5" fill="#0b2e26" stroke="#34d399"/><text x="161" y="87" fill="#ecfdf5" font-size="11">#102 CAT ★</text>
  </g>

  <line x1="286" y1="124" x2="286" y2="226" stroke="#1e293b" stroke-width="1.5"/>

  <!-- 8-Byte Card (x=304..756) -->
  <g transform="translate(304, 128)" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">
    <text x="220" y="12" fill="#cbd5e1" font-size="11.5" font-family="'Segoe UI', Inter, sans-serif">Its 4 Letter Shelves say which next letters exist: {B, R, T}</text>

    <rect x="0" y="24" width="60" height="44" rx="5" fill="#431407" stroke="#fb923c"/>
    <text x="30" y="42" fill="#ffedd5" font-size="10">Word ★</text>
    <text x="30" y="58" fill="#fb923c" font-size="11">0 (no)</text>

    <rect x="65" y="24" width="68" height="44" rx="5" fill="#172133" stroke="#475569"/>
    <text x="99" y="42" fill="#64748b" font-size="10">Shelf 3</text>
    <text x="99" y="58" fill="#64748b" font-size="10">Y–Z: —</text>

    <rect x="138" y="24" width="84" height="44" rx="5" fill="#0b2e26" stroke="#34d399" stroke-width="1.8"/>
    <text x="180" y="42" fill="#a7f3d0" font-size="10">Shelf 2</text>
    <text x="180" y="58" fill="#34d399" font-size="10.5">Q–X: R, T</text>

    <rect x="227" y="24" width="68" height="44" rx="5" fill="#172133" stroke="#475569"/>
    <text x="261" y="42" fill="#64748b" font-size="10">Shelf 1</text>
    <text x="261" y="58" fill="#64748b" font-size="10">I–P: —</text>

    <rect x="300" y="24" width="70" height="44" rx="5" fill="#0c2a42" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="335" y="42" fill="#bae6fd" font-size="10">Shelf 0</text>
    <text x="335" y="58" fill="#38bdf8" font-size="10.5">A–H: B</text>

    <rect x="378" y="24" width="70" height="44" rx="5" fill="#142645" stroke="#60a5fa"/>
    <text x="413" y="42" fill="#93c5fd" font-size="10">1st Child</text>
    <text x="413" y="58" fill="#fff" font-size="12">#100</text>

    <text x="224" y="88" fill="#64748b" font-size="10.5" font-family="'Segoe UI', Inter, sans-serif" font-weight="600">4 bytes of switches + 4-byte child start ID = 8 bytes (no child pointers needed!)</text>
  </g>

  <line x1="770" y1="124" x2="770" y2="226" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Deferred Word Note (x=786..1044) -->
  <g transform="translate(786, 128)" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">
    <text x="128" y="12" fill="#fed7aa" font-size="11.5" font-family="'Segoe UI', Inter, sans-serif">Complete word? Jot down fast!</text>
    <rect x="0" y="24" width="256" height="28" rx="5" fill="#172133" stroke="#475569"/>
    <text x="128" y="42" fill="#94a3b8" font-size="11">#45 "CA"  (★ = 0)  →  skip</text>
    <rect x="0" y="58" width="256" height="28" rx="5" fill="#0b2e26" stroke="#34d399"/>
    <text x="128" y="76" fill="#a7f3d0" font-size="11">#102 "CAT" (★ = 1) → append</text>
    <text x="128" y="102" fill="#fdba74" font-size="10" font-family="'Segoe UI', Inter, sans-serif" font-weight="600">Duplicates cleaned once at the end (Stage 6)</text>
  </g>

  <!-- =================================================================== -->
  <!-- BOTTOM BAND: 4-STEP PARALLEL SIMD CIRCUIT                           -->
  <!-- =================================================================== -->
  <rect x="20" y="252" width="1040" height="318" rx="10" fill="#0d1526" stroke="#1f2f46" stroke-width="1.2"/>
  <text x="38" y="276" fill="#7dd3fc" font-size="13" font-weight="700">B. Check all 16 board tiles in parallel (5 example tiles shown across the board)</text>

  <!-- Left Guide Column (x=38..236) -->
  <g transform="translate(38, 294)" font-weight="700">
    <!-- Contrast pill -->
    <rect x="0" y="0" width="194" height="44" rx="6" fill="#162032" stroke="#334155"/>
    <text x="97" y="18" fill="#fca5a5" font-size="10.5" text-anchor="middle">Slow way: 16 separate loops</text>
    <text x="97" y="34" fill="#6ee7b7" font-size="10.5" text-anchor="middle">SIMD way: all 16 at once!</text>

    <!-- 4 Step Callouts aligned with rows -->
    <text x="0" y="88" fill="#fde68a" font-size="12">1. Hand out shelves</text>
    <text x="0" y="103" fill="#94a3b8" font-size="10" font-family="Consolas, monospace">vpshufb (byte_sel)</text>

    <text x="0" y="136" fill="#7dd3fc" font-size="12">2. Test own switch</text>
    <text x="0" y="151" fill="#94a3b8" font-size="10" font-family="Consolas, monospace">AND bit_sel</text>

    <text x="0" y="184" fill="#a7f3d0" font-size="12">3. Flip YES / NO light</text>
    <text x="0" y="199" fill="#94a3b8" font-size="10" font-family="Consolas, monospace">+ 127 → top bit LED</text>

    <text x="0" y="234" fill="#e0f2fe" font-size="12">4. Snap 16-bit photo</text>
    <text x="0" y="249" fill="#7dd3fc" font-size="10" font-family="Consolas, monospace">pmovmskb</text>
  </g>

  <!-- Right 5-Lane SIMD Circuit (x=246..1044, width=798) -->
  <g transform="translate(246, 294)" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">
    <!-- Broadcast Shelves -->
    <rect x="74" y="4" width="144" height="30" rx="5" fill="#0c2a42" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="146" y="23" fill="#e0f2fe" font-size="12">Shelf 0: [ B ]</text>

    <rect x="234" y="4" width="128" height="30" rx="5" fill="#172133" stroke="#475569"/>
    <text x="298" y="23" fill="#64748b" font-size="12">Shelf 1: [ — ]</text>

    <rect x="378" y="4" width="168" height="30" rx="5" fill="#0b2e26" stroke="#34d399" stroke-width="1.6"/>
    <text x="462" y="23" fill="#a7f3d0" font-size="12">Shelf 2: [ R, T ]</text>

    <rect x="562" y="4" width="128" height="30" rx="5" fill="#172133" stroke="#475569"/>
    <text x="626" y="23" fill="#64748b" font-size="12">Shelf 3: [ — ]</text>

    <!-- Routing Wires (lane centers: 76, 236, 396, 556, 716) -->
    <path d="M 130 34 C 130 54, 76 52, 76 70" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#mS)"/>
    <path d="M 162 34 C 162 66, 716 46, 716 70" fill="none" stroke="#38bdf8" stroke-width="2.4" marker-end="url(#mC)"/>
    <path d="M 436 34 C 436 54, 236 52, 236 70" fill="none" stroke="#34d399" stroke-width="2.4" marker-end="url(#mG)"/>
    <path d="M 462 34 C 462 54, 396 52, 396 70" fill="none" stroke="#34d399" stroke-width="2.4" marker-end="url(#mG)"/>
    <path d="M 488 34 C 488 54, 556 52, 556 70" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#mS)"/>

    <!-- Row 1: Grabbed Shelf -->
    <g transform="translate(0, 74)">
      <rect x="4" y="0" width="144" height="32" rx="5" fill="#172133" stroke="#475569"/><text x="76" y="20" fill="#94a3b8" font-size="11.5">@0 'C' → [ B ]</text>
      <rect x="164" y="0" width="144" height="32" rx="5" fill="#0b2e26" stroke="#34d399"/><text x="236" y="20" fill="#a7f3d0" font-size="11.5">@2 'T' → [ R, T ]</text>
      <rect x="324" y="0" width="144" height="32" rx="5" fill="#0b2e26" stroke="#34d399"/><text x="396" y="20" fill="#a7f3d0" font-size="11.5">@5 'R' → [ R, T ]</text>
      <rect x="484" y="0" width="144" height="32" rx="5" fill="#172133" stroke="#475569"/><text x="556" y="20" fill="#94a3b8" font-size="11.5">@3 'S' → [ R, T ]</text>
      <rect x="644" y="0" width="144" height="32" rx="5" fill="#0c2a42" stroke="#38bdf8"/><text x="716" y="20" fill="#e0f2fe" font-size="11.5">@15 'B' → [ B ]</text>
    </g>

    <!-- Row 2: Test Own Switch -->
    <g transform="translate(0, 122)">
      <rect x="4" y="0" width="144" height="32" rx="5" fill="#111a2c" stroke="#334155"/><text x="76" y="20" fill="#64748b" font-size="11.5">C in [B]?  NO</text>
      <rect x="164" y="0" width="144" height="32" rx="5" fill="#065f46" stroke="#34d399"/><text x="236" y="20" fill="#ecfdf5" font-size="11.5">T in [R,T]? YES</text>
      <rect x="324" y="0" width="144" height="32" rx="5" fill="#065f46" stroke="#34d399"/><text x="396" y="20" fill="#ecfdf5" font-size="11.5">R in [R,T]? YES</text>
      <rect x="484" y="0" width="144" height="32" rx="5" fill="#111a2c" stroke="#334155"/><text x="556" y="20" fill="#64748b" font-size="11.5">S in [R,T]? NO</text>
      <rect x="644" y="0" width="144" height="32" rx="5" fill="#0284c7" stroke="#bae6fd"/><text x="716" y="20" fill="#fff" font-size="11.5">B in [B]?  YES</text>
    </g>

    <!-- Row 3: YES/NO LEDs -->
    <g transform="translate(0, 170)">
      <rect x="4" y="0" width="144" height="30" rx="5" fill="#111a2c" stroke="#334155"/>
      <circle cx="48" cy="15" r="6" fill="#334155"/><text x="90" y="19" fill="#64748b" font-size="11.5">0 (off)</text>

      <rect x="164" y="0" width="144" height="30" rx="5" fill="#0b2e26" stroke="#34d399"/>
      <circle cx="208" cy="15" r="6" fill="#34d399"/><text x="250" y="19" fill="#a7f3d0" font-size="11.5">1 (ON)</text>

      <rect x="324" y="0" width="144" height="30" rx="5" fill="#0b2e26" stroke="#34d399"/>
      <circle cx="368" cy="15" r="6" fill="#34d399"/><text x="410" y="19" fill="#a7f3d0" font-size="11.5">1 (ON)</text>

      <rect x="484" y="0" width="144" height="30" rx="5" fill="#111a2c" stroke="#334155"/>
      <circle cx="528" cy="15" r="6" fill="#334155"/><text x="570" y="19" fill="#64748b" font-size="11.5">0 (off)</text>

      <rect x="644" y="0" width="144" height="30" rx="5" fill="#0284c7" stroke="#bae6fd"/>
      <circle cx="688" cy="15" r="6" fill="#7dd3fc"/><text x="730" y="19" fill="#fff" font-size="11.5">1 (ON)</text>
    </g>

    <!-- Collector bus -> Row 4: 16-Bit Photo -->
    <path d="M 76 200 L 76 210 L 716 210 L 716 200" fill="none" stroke="#475569" stroke-width="1.6"/>
    <line x1="556" y1="200" x2="556" y2="210" stroke="#475569" stroke-width="1.6"/>
    <line x1="236" y1="200" x2="236" y2="210" stroke="#34d399" stroke-width="2.2"/>
    <line x1="396" y1="200" x2="396" y2="210" stroke="#34d399" stroke-width="2.2"/>
    <line x1="716" y1="200" x2="716" y2="210" stroke="#38bdf8" stroke-width="2.2"/>
    <line x1="236" y1="210" x2="716" y2="210" stroke="#38bdf8" stroke-width="2"/>
    <line x1="396" y1="210" x2="396" y2="220" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#mC)"/>

    <rect x="76" y="224" width="640" height="32" rx="6" fill="#0c2f4f" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="396" y="244" fill="#e0f2fe" font-size="12">16-Bit Match Mask:   <tspan fill="#38bdf8">1</tspan><tspan fill="#94a3b8">000 0000 00</tspan><tspan fill="#34d399">1</tspan><tspan fill="#94a3b8">0 0</tspan><tspan fill="#34d399">1</tspan><tspan fill="#94a3b8">00₂</tspan>   →   @2 'T', @5 'R', @15 'B'</text>
  </g>

  <!-- Bottom Takeaway Bar -->
  <rect x="20" y="582" width="1040" height="42" rx="8" fill="#111a2c" stroke="#263449"/>
  <text x="38" y="608" fill="#34d399" font-size="12.5" font-weight="700">Why it's fast:</text>
  <text x="132" y="608" fill="#cbd5e1" font-size="12.5">Tests every square on the board against the dictionary at once — no per-tile loop or branching.</text>
  <rect x="822" y="591" width="224" height="24" rx="12" fill="#132238" stroke="#2a4365"/>
  <text x="934" y="607" fill="#7dd3fc" font-size="10.5" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">SSSE3 · vpshufb + AND + pmovmskb</text>
</svg>
