<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="100%" height="100%" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111a2c"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f2942"/>
      <stop offset="100%" stop-color="#0d3530"/>
    </linearGradient>
    <marker id="mG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker>
  </defs>

  <!-- Canvas -->
  <rect width="1080" height="640" rx="14" fill="url(#bg)" stroke="#263449" stroke-width="2"/>

  <!-- Header + 6-Stage Stepper -->
  <rect x="20" y="16" width="1040" height="64" rx="10" fill="url(#hdr)" stroke="#2a4365" stroke-width="1.2"/>
  <circle cx="48" cy="48" r="15" fill="#0284c7"/><text x="48" y="54" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">4</text>
  <text x="74" y="43" fill="#f8fafc" font-size="18.5" font-weight="700">Stage 4 · The 16-Bit Grid Filter — Stacking 3 Stencils</text>
  <text x="74" y="64" fill="#94a3b8" font-size="12">Turn each Boggle rule into a 4×4 on/off stencil (one 16-bit number). Stack them with AND — only legal moves shine through.</text>

  <!-- 6-Stage Progress Stepper -->
  <g transform="translate(836, 37)" font-size="11" font-weight="700" text-anchor="middle">
    <line x1="12" y1="11" x2="188" y2="11" stroke="#334155" stroke-width="2"/>
    <circle cx="12" cy="11" r="10" fill="#0c2f4f" stroke="#38bdf8"/><text x="12" y="15" fill="#7dd3fc">1</text>
    <circle cx="47" cy="11" r="10" fill="#2b1b08" stroke="#fbbf24"/><text x="47" y="15" fill="#fde68a">2</text>
    <circle cx="82" cy="11" r="10" fill="#0c2f4f" stroke="#38bdf8"/><text x="82" y="15" fill="#7dd3fc">3</text>
    <circle cx="117" cy="11" r="11" fill="#0284c7" stroke="#bae6fd" stroke-width="1.6"/><text x="117" y="15" fill="#fff">4</text>
    <circle cx="152" cy="11" r="10" fill="#172133" stroke="#475569"/><text x="152" y="15" fill="#64748b">5</text>
    <circle cx="187" cy="11" r="10" fill="#172133" stroke="#475569"/><text x="187" y="15" fill="#64748b">6</text>
  </g>

  <!-- =================================================================== -->
  <!-- TOP BAND: 3 TRANSPARENT STENCILS COMBINED WITH BITWISE AND          -->
  <!-- =================================================================== -->
  <rect x="20" y="92" width="1040" height="240" rx="10" fill="#0d1526" stroke="#1f2f46" stroke-width="1.2"/>
  <text x="38" y="114" fill="#7dd3fc" font-size="13" font-weight="700">A. Stack 3 transparent 4×4 stencils for path #45 "CA" standing on tile @1</text>

  <!-- Stencil 1: Touching @1 (cx=190) -->
  <g transform="translate(38, 126)">
    <text x="152" y="14" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">Stencil 1: Touching tile @1?</text>
    <g transform="translate(96, 26)" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
      <rect x="0" y="0" width="28" height="28" fill="#f59e0b" stroke="#fef3c7"/><text x="14" y="19" fill="#451a03">0</text>
      <rect x="28" y="0" width="28" height="28" fill="#0284c7" stroke="#fff"/><text x="42" y="19" fill="#fff">@1</text>
      <rect x="56" y="0" width="28" height="28" fill="#f59e0b" stroke="#fef3c7"/><text x="70" y="19" fill="#451a03">2</text>
      <rect x="84" y="0" width="28" height="28" fill="#172133" stroke="#334155"/>

      <rect x="0" y="28" width="28" height="28" fill="#f59e0b" stroke="#fef3c7"/><text x="14" y="47" fill="#451a03">4</text>
      <rect x="28" y="28" width="28" height="28" fill="#f59e0b" stroke="#fef3c7"/><text x="42" y="47" fill="#451a03">5</text>
      <rect x="56" y="28" width="28" height="28" fill="#f59e0b" stroke="#fef3c7"/><text x="70" y="47" fill="#451a03">6</text>
      <rect x="84" y="28" width="28" height="28" fill="#172133" stroke="#334155"/>

      <rect x="0" y="56" width="28" height="28" fill="#172133" stroke="#334155"/><rect x="28" y="56" width="28" height="28" fill="#172133" stroke="#334155"/><rect x="56" y="56" width="28" height="28" fill="#172133" stroke="#334155"/><rect x="84" y="56" width="28" height="28" fill="#172133" stroke="#334155"/>
      <rect x="0" y="84" width="28" height="28" fill="#172133" stroke="#334155"/><rect x="28" y="84" width="28" height="28" fill="#172133" stroke="#334155"/><rect x="56" y="84" width="28" height="28" fill="#172133" stroke="#334155"/><rect x="84" y="84" width="28" height="28" fill="#172133" stroke="#334155"/>
    </g>
    <text x="152" y="158" fill="#64748b" font-size="12" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">0000 0000 0<tspan fill="#fbbf24">111</tspan> 0<tspan fill="#fbbf24">1</tspan>0<tspan fill="#fbbf24">1</tspan>₂</text>
    <text x="152" y="178" fill="#94a3b8" font-size="11" text-anchor="middle">5 open holes around @1 (pre-built table)</text>
  </g>

  <!-- & operator 1 -->
  <circle cx="366" cy="208" r="18" fill="#162032" stroke="#64748b" stroke-width="1.6"/>
  <text x="366" y="214" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">&amp;</text>

  <!-- Stencil 2: Not Visited Yet (cx=540) -->
  <g transform="translate(388, 126)">
    <text x="152" y="14" fill="#e9d5ff" font-size="12.5" font-weight="700" text-anchor="middle">Stencil 2: Unused Square?</text>
    <g transform="translate(96, 26)" font-family="Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">
      <rect x="0" y="0" width="28" height="28" fill="#3f1219" stroke="#f87171"/><text x="14" y="19" fill="#f87171">✕</text>
      <rect x="28" y="0" width="28" height="28" fill="#3f1219" stroke="#f87171"/><text x="42" y="19" fill="#f87171">✕</text>
      <rect x="56" y="0" width="28" height="28" fill="#7e22ce" stroke="#e9d5ff"/>
      <rect x="84" y="0" width="28" height="28" fill="#7e22ce" stroke="#e9d5ff"/>

      <rect x="0" y="28" width="28" height="28" fill="#7e22ce" stroke="#e9d5ff"/><rect x="28" y="28" width="28" height="28" fill="#7e22ce" stroke="#e9d5ff"/><rect x="56" y="28" width="28" height="28" fill="#7e22ce" stroke="#e9d5ff"/><rect x="84" y="28" width="28" height="28" fill="#7e22ce" stroke="#e9d5ff"/>
      <rect x="0" y="56" width="28" height="28" fill="#7e22ce" stroke="#e9d5ff"/><rect x="28" y="56" width="28" height="28" fill="#7e22ce" stroke="#e9d5ff"/><rect x="56" y="56" width="28" height="28" fill="#7e22ce" stroke="#e9d5ff"/><rect x="84" y="56" width="28" height="28" fill="#7e22ce" stroke="#e9d5ff"/>
      <rect x="0" y="84" width="28" height="28" fill="#7e22ce" stroke="#e9d5ff"/><rect x="28" y="84" width="28" height="28" fill="#7e22ce" stroke="#e9d5ff"/><rect x="56" y="84" width="28" height="28" fill="#7e22ce" stroke="#e9d5ff"/><rect x="84" y="84" width="28" height="28" fill="#7e22ce" stroke="#e9d5ff"/>
    </g>
    <text x="152" y="158" fill="#c084fc" font-size="12" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">1111 1111 1111 11<tspan fill="#f87171">00</tspan>₂</text>
    <text x="152" y="178" fill="#94a3b8" font-size="11" text-anchor="middle">C (0) &amp; A (1) blocked — can't reuse tiles</text>
  </g>

  <!-- & operator 2 -->
  <circle cx="714" cy="208" r="18" fill="#162032" stroke="#64748b" stroke-width="1.6"/>
  <text x="714" y="214" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">&amp;</text>

  <!-- Stencil 3: Valid Next Letters {B,R,T} (cx=890) -->
  <g transform="translate(738, 126)">
    <text x="152" y="14" fill="#7dd3fc" font-size="12.5" font-weight="700" text-anchor="middle">Stencil 3: Letter in {B, R, T}?</text>
    <g transform="translate(96, 26)" font-family="Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">
      <rect x="0" y="0" width="28" height="28" fill="#172133" stroke="#334155"/><rect x="28" y="0" width="28" height="28" fill="#172133" stroke="#334155"/>
      <rect x="56" y="0" width="28" height="28" fill="#0284c7" stroke="#e0f2fe"/><text x="70" y="19" fill="#fff">T</text>
      <rect x="84" y="0" width="28" height="28" fill="#172133" stroke="#334155"/>

      <rect x="0" y="28" width="28" height="28" fill="#172133" stroke="#334155"/>
      <rect x="28" y="28" width="28" height="28" fill="#0284c7" stroke="#e0f2fe"/><text x="42" y="47" fill="#fff">R</text>
      <rect x="56" y="28" width="28" height="28" fill="#172133" stroke="#334155"/><rect x="84" y="28" width="28" height="28" fill="#172133" stroke="#334155"/>

      <rect x="0" y="56" width="28" height="28" fill="#172133" stroke="#334155"/><rect x="28" y="56" width="28" height="28" fill="#172133" stroke="#334155"/><rect x="56" y="56" width="28" height="28" fill="#172133" stroke="#334155"/><rect x="84" y="56" width="28" height="28" fill="#172133" stroke="#334155"/>

      <rect x="0" y="84" width="28" height="28" fill="#172133" stroke="#334155"/><rect x="28" y="84" width="28" height="28" fill="#172133" stroke="#334155"/><rect x="56" y="84" width="28" height="28" fill="#172133" stroke="#334155"/>
      <rect x="84" y="84" width="28" height="28" fill="#0284c7" stroke="#e0f2fe"/><text x="98" y="103" fill="#fff">B</text>
    </g>
    <text x="152" y="158" fill="#64748b" font-size="12" font-family="Consolas, monospace" font-weight="700" text-anchor="middle"><tspan fill="#38bdf8">1</tspan>000 0000 00<tspan fill="#38bdf8">1</tspan>0 0<tspan fill="#38bdf8">1</tspan>00₂</text>
    <text x="152" y="178" fill="#94a3b8" font-size="11" text-anchor="middle">16-bit match mask from Stage 3 SIMD</text>
  </g>

  <!-- Convergence Bracket + "=" circle (y=332..366) -->
  <path d="M 190 332 L 190 344 L 890 344 L 890 332" fill="none" stroke="#475569" stroke-width="1.8"/>
  <line x1="540" y1="332" x2="540" y2="344" stroke="#475569" stroke-width="1.8"/>
  <line x1="540" y1="344" x2="274" y2="344" stroke="#34d399" stroke-width="2"/>
  <line x1="274" y1="344" x2="274" y2="365" stroke="#34d399" stroke-width="2.2" marker-end="url(#mG)"/>
  <circle cx="540" cy="344" r="15" fill="#064e3b" stroke="#34d399" stroke-width="1.8"/>
  <text x="540" y="350" fill="#ecfdf5" font-size="18" font-weight="700" text-anchor="middle">=</text>

  <!-- =================================================================== -->
  <!-- BOTTOM LEFT: SURVIVING MASK ("keep") + TILE SCORECARD (x=20..524)   -->
  <!-- =================================================================== -->
  <rect x="20" y="368" width="504" height="202" rx="10" fill="#082a23" stroke="#34d399" stroke-width="1.6"/>
  <text x="38" y="392" fill="#ecfdf5" font-size="13.5" font-weight="700">B. Light shines through only legal moves ("keep")</text>

  <!-- Big 120x120 Emerald Result Grid -->
  <g transform="translate(40, 406)" font-family="Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="0" y="0" width="30" height="30" fill="#0d1526" stroke="#334155"/><rect x="30" y="0" width="30" height="30" fill="#0d1526" stroke="#334155"/>
    <rect x="60" y="0" width="30" height="30" fill="#10b981" stroke="#fff" stroke-width="1.8"/><text x="75" y="20" fill="#022c22">T</text>
    <rect x="90" y="0" width="30" height="30" fill="#0d1526" stroke="#334155"/>

    <rect x="0" y="30" width="30" height="30" fill="#0d1526" stroke="#334155"/>
    <rect x="30" y="30" width="30" height="30" fill="#10b981" stroke="#fff" stroke-width="1.8"/><text x="45" y="50" fill="#022c22">R</text>
    <rect x="60" y="30" width="30" height="30" fill="#0d1526" stroke="#334155"/><rect x="90" y="30" width="30" height="30" fill="#0d1526" stroke="#334155"/>

    <rect x="0" y="60" width="30" height="30" fill="#0d1526" stroke="#334155"/><rect x="30" y="60" width="30" height="30" fill="#0d1526" stroke="#334155"/><rect x="60" y="60" width="30" height="30" fill="#0d1526" stroke="#334155"/><rect x="90" y="60" width="30" height="30" fill="#0d1526" stroke="#334155"/>

    <rect x="0" y="90" width="30" height="30" fill="#0d1526" stroke="#334155"/><rect x="30" y="90" width="30" height="30" fill="#0d1526" stroke="#334155"/><rect x="60" y="90" width="30" height="30" fill="#0d1526" stroke="#334155"/>
    <rect x="90" y="90" width="30" height="30" fill="#3f1219" stroke="#f87171"/><text x="105" y="110" fill="#f87171" font-size="11.5">B✕</text>
  </g>
  <text x="100" y="550" fill="#6ee7b7" font-size="11.5" font-family="Consolas, monospace" font-weight="700" text-anchor="middle"><tspan fill="#f87171">0</tspan>000 0000 00<tspan fill="#fff">1</tspan>0 0<tspan fill="#fff">1</tspan>00₂</text>

  <!-- Tile-by-Tile Scorecard -->
  <g transform="translate(182, 410)" font-family="Consolas, monospace" font-size="11" font-weight="700">
    <text x="0" y="12" fill="#a7f3d0" font-size="11" font-family="'Segoe UI', Inter, sans-serif">Why each candidate tile passed or failed:</text>

    <rect x="0" y="22" width="322" height="32" rx="5" fill="#064e3b" stroke="#34d399"/>
    <text x="12" y="42" fill="#fff">@2 'T'</text>
    <text x="72" y="42" fill="#a7f3d0">Touch ✓ · Free ✓ · Match ✓</text>
    <text x="310" y="42" fill="#34d399" text-anchor="end">KEEP</text>

    <rect x="0" y="62" width="322" height="32" rx="5" fill="#064e3b" stroke="#34d399"/>
    <text x="12" y="82" fill="#fff">@5 'R'</text>
    <text x="72" y="82" fill="#a7f3d0">Touch ✓ · Free ✓ · Match ✓</text>
    <text x="310" y="82" fill="#34d399" text-anchor="end">KEEP</text>

    <rect x="0" y="102" width="322" height="32" rx="5" fill="#2c1218" stroke="#f87171"/>
    <text x="12" y="122" fill="#fca5a5">@15 'B'</text>
    <text x="72" y="122" fill="#cbd5e1"><tspan fill="#f87171">Touch ✕</tspan> · Free ✓ · Match ✓</text>
    <text x="310" y="122" fill="#f87171" text-anchor="end">DROP</text>
  </g>

  <!-- Arrow Result -> Dead-End Gate -->
  <line x1="524" y1="470" x2="554" y2="470" stroke="#34d399" stroke-width="2.6" marker-end="url(#mG)"/>

  <!-- =================================================================== -->
  <!-- BOTTOM RIGHT: DEAD-END TRASH CHUTE (~54% DROPPED) (x=560..1060)     -->
  <!-- =================================================================== -->
  <rect x="560" y="368" width="500" height="202" rx="10" fill="#0d1526" stroke="#1f2f46" stroke-width="1.2"/>
  <text x="578" y="392" fill="#f8fafc" font-size="13.5" font-weight="700">C. Instant Dead-End Chute (Drops Over Half of All Paths!)</text>

  <!-- Proportional 54% / 46% bar -->
  <g transform="translate(578, 408)" font-weight="700" text-anchor="middle">
    <rect x="0" y="0" width="250" height="38" rx="6" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/>
    <text x="125" y="16" fill="#fca5a5" font-size="11.5">~54% Dead Ends (keep == 0)</text>
    <text x="125" y="31" fill="#f87171" font-size="10.5">Dropped immediately ✕</text>

    <rect x="256" y="0" width="208" height="38" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="360" y="16" fill="#ecfdf5" font-size="11.5">~46% Survive (keep != 0)</text>
    <text x="360" y="31" fill="#34d399" font-size="10.5">Sent to Stage 5 ✓</text>
  </g>

  <!-- Two clean outcome descriptions -->
  <g transform="translate(578, 460)" font-size="11.5">
    <rect x="0" y="0" width="464" height="44" rx="6" fill="#241218" stroke="#7f1d1d"/>
    <text x="14" y="19" fill="#fca5a5" font-weight="700">No holes open (keep == 0):</text>
    <text x="14" y="36" fill="#cbd5e1">This path has zero legal next letters — throw it away without touching Stage 5.</text>

    <rect x="0" y="52" width="464" height="44" rx="6" fill="#0b2e26" stroke="#34d399" stroke-opacity="0.7"/>
    <text x="14" y="71" fill="#a7f3d0" font-weight="700">At least 1 hole open (keep != 0):</text>
    <text x="14" y="88" fill="#cbd5e1">Append {node #45, switches, keep} to the active_ list for Stage 5 bit scan →</text>
  </g>

  <!-- Bottom Takeaway Bar -->
  <rect x="20" y="582" width="1040" height="42" rx="8" fill="#111a2c" stroke="#263449"/>
  <text x="38" y="608" fill="#34d399" font-size="12.5" font-weight="700">Why it's fast:</text>
  <text x="132" y="608" fill="#cbd5e1" font-size="12.5">All three Boggle rules combine in two 16-bit AND instructions — pruning ~54% of dead paths early.</text>
  <rect x="820" y="591" width="226" height="24" rx="12" fill="#132238" stroke="#2a4365"/>
  <text x="933" y="607" fill="#7dd3fc" font-size="10.5" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">adj &amp; ~visited &amp; simd_mask</text>
</svg>
