<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="100%" height="100%" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111a2c"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0d3530"/>
    </linearGradient>
    <marker id="mG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker>
    <marker id="mP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/></marker>
    <marker id="mR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/></marker>
  </defs>

  <!-- Canvas -->
  <rect width="1080" height="640" rx="14" fill="url(#bg)" stroke="#263449" stroke-width="2"/>

  <!-- Header + 6-Stage Stepper -->
  <rect x="20" y="16" width="1040" height="64" rx="10" fill="url(#hdr)" stroke="#5b21b6" stroke-width="1.2"/>
  <circle cx="48" cy="48" r="15" fill="#6d28d9"/><text x="48" y="54" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">6</text>
  <text x="74" y="43" fill="#f8fafc" font-size="18.5" font-weight="700">Stage 6 · Deduplication, Zero-Copy Words &amp; Instant Reset</text>
  <text x="74" y="64" fill="#94a3b8" font-size="12">Once all paths finish, filter duplicates with a 1-bit checklist, point into one shared word book, and reset only touched rows.</text>

  <!-- 6-Stage Progress Stepper -->
  <g transform="translate(836, 37)" font-size="11" font-weight="700" text-anchor="middle">
    <line x1="12" y1="11" x2="188" y2="11" stroke="#334155" stroke-width="2"/>
    <circle cx="12" cy="11" r="10" fill="#0c2f4f" stroke="#38bdf8"/><text x="12" y="15" fill="#7dd3fc">1</text>
    <circle cx="47" cy="11" r="10" fill="#2b1b08" stroke="#fbbf24"/><text x="47" y="15" fill="#fde68a">2</text>
    <circle cx="82" cy="11" r="10" fill="#0c2f4f" stroke="#38bdf8"/><text x="82" y="15" fill="#7dd3fc">3</text>
    <circle cx="117" cy="11" r="10" fill="#0c2f4f" stroke="#38bdf8"/><text x="117" y="15" fill="#7dd3fc">4</text>
    <circle cx="152" cy="11" r="10" fill="#0b2e26" stroke="#34d399"/><text x="152" y="15" fill="#a7f3d0">5</text>
    <circle cx="187" cy="11" r="11" fill="#6d28d9" stroke="#e9d5ff" stroke-width="1.6"/><text x="187" y="15" fill="#fff">6</text>
  </g>

  <!-- =================================================================== -->
  <!-- CARD A: 1-BIT CHECKLIST DEDUPLICATION (x=20..356, y=94..568)        -->
  <!-- =================================================================== -->
  <rect x="20" y="94" width="336" height="474" rx="10" fill="#0d1526" stroke="#1f2f46" stroke-width="1.2"/>
  <text x="188" y="120" fill="#fed7aa" font-size="13.5" font-weight="700" text-anchor="middle">A. Drop Duplicate Words</text>
  <text x="188" y="139" fill="#94a3b8" font-size="11" text-anchor="middle">Different board paths can spell the same word</text>

  <!-- Why duplicates happen callout -->
  <rect x="38" y="154" width="300" height="58" rx="7" fill="#162032" stroke="#334155"/>
  <text x="188" y="176" fill="#e2e8f0" font-size="11.5" font-weight="700" text-anchor="middle">Raw hit list recorded during search:</text>
  <text x="188" y="198" fill="#94a3b8" font-size="11" text-anchor="middle">e.g. "CAT" (#102) reached by 2 routes → listed twice!</text>

  <!-- Funnel Visual -->
  <g transform="translate(38, 228)" font-family="Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">
    <!-- 4 raw candidates -->
    <rect x="0" y="0" width="68" height="28" rx="5" fill="#065f46" stroke="#34d399"/><text x="34" y="19" fill="#fff">#102</text>
    <rect x="77" y="0" width="68" height="28" rx="5" fill="#065f46" stroke="#34d399"/><text x="111" y="19" fill="#fff">#101</text>
    <rect x="154" y="0" width="68" height="28" rx="5" fill="#3f1219" stroke="#f87171"/><text x="188" y="19" fill="#fca5a5">#102</text>
    <rect x="231" y="0" width="68" height="28" rx="5" fill="#065f46" stroke="#34d399"/><text x="265" y="19" fill="#fff">#108</text>

    <!-- Arrows down -->
    <line x1="34" y1="28" x2="34" y2="52" stroke="#34d399" stroke-width="2" marker-end="url(#mG)"/>
    <line x1="111" y1="28" x2="111" y2="52" stroke="#34d399" stroke-width="2" marker-end="url(#mG)"/>
    <line x1="188" y1="28" x2="188" y2="52" stroke="#f87171" stroke-width="2" marker-end="url(#mR)"/>
    <line x1="265" y1="28" x2="265" y2="52" stroke="#34d399" stroke-width="2" marker-end="url(#mG)"/>

    <!-- 1-Bit Checklist Card -->
    <rect x="0" y="56" width="300" height="72" rx="7" fill="#1a2234" stroke="#fb923c" stroke-width="1.5"/>
    <text x="150" y="76" fill="#fed7aa" font-size="11.5" font-family="'Segoe UI', Inter, sans-serif">1-Bit-Per-Word Checklist (found_word_bits_)</text>
    <!-- Mini checkboxes -->
    <g transform="translate(14, 88)" font-size="10.5">
      <rect x="0" y="0" width="62" height="26" rx="4" fill="#0b2e26" stroke="#34d399"/><text x="31" y="17" fill="#6ee7b7">101 [✓]</text>
      <rect x="70" y="0" width="62" height="26" rx="4" fill="#0b2e26" stroke="#34d399"/><text x="101" y="17" fill="#6ee7b7">102 [✓]</text>
      <rect x="140" y="0" width="62" height="26" rx="4" fill="#111a2c" stroke="#334155"/><text x="171" y="17" fill="#64748b">103 [ ]</text>
      <rect x="210" y="0" width="62" height="26" rx="4" fill="#0b2e26" stroke="#34d399"/><text x="241" y="17" fill="#6ee7b7">108 [✓]</text>
    </g>

    <!-- Outgoing unique paths -->
    <line x1="34" y1="128" x2="48" y2="162" stroke="#34d399" stroke-width="2" marker-end="url(#mG)"/>
    <line x1="111" y1="128" x2="150" y2="162" stroke="#c084fc" stroke-width="2" marker-end="url(#mP)"/>
    <line x1="265" y1="128" x2="252" y2="162" stroke="#c084fc" stroke-width="2" marker-end="url(#mP)"/>

    <!-- Blocked duplicate badge -->
    <line x1="188" y1="128" x2="188" y2="137" stroke="#f87171" stroke-width="2"/>
    <rect x="150" y="137" width="76" height="20" rx="10" fill="#7f1d1d" stroke="#f87171"/>
    <text x="188" y="151" fill="#fee2e2" font-size="10">✕ already 1</text>

    <!-- Unique survivors -->
    <rect x="8" y="168" width="82" height="32" rx="6" fill="#065f46" stroke="#34d399"/><text x="49" y="189" fill="#fff">#102</text>
    <rect x="109" y="168" width="82" height="32" rx="6" fill="#4c1d95" stroke="#c084fc"/><text x="150" y="189" fill="#fff">#101</text>
    <rect x="210" y="168" width="82" height="32" rx="6" fill="#4c1d95" stroke="#c084fc"/><text x="251" y="189" fill="#fff">#108</text>
  </g>

  <text x="188" y="458" fill="#cbd5e1" font-size="11.5" font-weight="700" text-anchor="middle">Rule: 0 → tick to 1 &amp; keep · already 1 → drop!</text>
  <rect x="38" y="476" width="300" height="72" rx="7" fill="#131e33" stroke="#263449"/>
  <text x="188" y="498" fill="#a7f3d0" font-size="11.5" font-weight="700" text-anchor="middle">Why wait until the end?</text>
  <text x="188" y="518" fill="#94a3b8" font-size="11" text-anchor="middle">Keeps the 17 KB checklist out of CPU cache</text>
  <text x="188" y="535" fill="#94a3b8" font-size="11" text-anchor="middle">during the hot search loop (Stages 3–5).</text>

  <!-- Arrow A -> B -->
  <line x1="356" y1="320" x2="380" y2="320" stroke="#c084fc" stroke-width="2.6" marker-end="url(#mP)"/>

  <!-- =================================================================== -->
  <!-- CARD B: ZERO-COPY WORD BOOKMARKS (x=386..714, y=94..568)            -->
  <!-- =================================================================== -->
  <rect x="386" y="94" width="328" height="474" rx="10" fill="#0d1526" stroke="#1f2f46" stroke-width="1.2"/>
  <text x="550" y="120" fill="#e9d5ff" font-size="13.5" font-weight="700" text-anchor="middle">B. Zero-Copy Word Bookmarks</text>
  <text x="550" y="139" fill="#94a3b8" font-size="11" text-anchor="middle">Point straight into one shared dictionary buffer</text>

  <!-- Contrast box -->
  <rect x="404" y="154" width="292" height="62" rx="7" fill="#162032" stroke="#334155"/>
  <text x="550" y="175" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">Slow way: allocate &amp; copy new text per word</text>
  <text x="550" y="198" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">Fast way: hand out tiny [start, length] views!</text>

  <!-- Bookmark Table -> Flat Ribbon Visual -->
  <g transform="translate(404, 232)" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">
    <text x="146" y="10" fill="#e9d5ff" font-size="11.5" font-family="'Segoe UI', Inter, sans-serif">4-byte packed bookmarks (word_spans_)</text>

    <!-- Two view cards side by side -->
    <rect x="0" y="22" width="140" height="48" rx="6" fill="#4c1d95" stroke="#c084fc" stroke-width="1.6"/>
    <text x="70" y="42" fill="#fff" font-size="12">#101 → "CAR"</text>
    <text x="70" y="60" fill="#e9d5ff" font-size="10.5">[start: 3, len: 3]</text>

    <rect x="152" y="22" width="140" height="48" rx="6" fill="#0b2e26" stroke="#34d399" stroke-width="1.6"/>
    <text x="222" y="42" fill="#fff" font-size="12">#102 → "CAT"</text>
    <text x="222" y="60" fill="#a7f3d0" font-size="10.5">[start: 6, len: 3]</text>

    <!-- Clean unobstructed vertical arrows straight into slices -->
    <line x1="126" y1="70" x2="126" y2="102" stroke="#c084fc" stroke-width="2.2" marker-end="url(#mP)"/>
    <line x1="234" y1="70" x2="234" y2="102" stroke="#34d399" stroke-width="2.2" marker-end="url(#mG)"/>

    <!-- Shared Immutable Word Text Ribbon (indices tucked cleanly inside each slice) -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="76" height="46" rx="4" fill="#172133" stroke="#475569"/>
      <text x="38" y="23" fill="#64748b" font-size="13.5">C A B</text>
      <text x="38" y="39" fill="#475569" font-size="9">bytes 0..2</text>

      <rect x="80" y="0" width="104" height="46" rx="4" fill="#581c87" stroke="#c084fc" stroke-width="1.8"/>
      <text x="132" y="23" fill="#fff" font-size="14">C A R</text>
      <text x="132" y="39" fill="#e9d5ff" font-size="9">bytes 3..5</text>

      <rect x="188" y="0" width="104" height="46" rx="4" fill="#065f46" stroke="#34d399" stroke-width="1.8"/>
      <text x="240" y="23" fill="#fff" font-size="14">C A T</text>
      <text x="240" y="39" fill="#a7f3d0" font-size="9">bytes 6..8</text>
    </g>

    <text x="146" y="173" fill="#94a3b8" font-size="10.5" font-family="'Segoe UI', Inter, sans-serif">One permanent shared word book (word_text_)</text>
  </g>

  <!-- Zero-copy result summary -->
  <rect x="404" y="422" width="292" height="126" rx="8" fill="#131e33" stroke="#7c3aed" stroke-opacity="0.7"/>
  <text x="550" y="446" fill="#e9d5ff" font-size="12" font-weight="700" text-anchor="middle">Output returned to caller:</text>
  <text x="550" y="472" fill="#fff" font-size="13" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">["CAT", "CAR", "TAR", ...]</text>
  <text x="550" y="498" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">✓ Zero heap memory allocations</text>
  <text x="550" y="517" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">✓ Zero character copying</text>
  <text x="550" y="536" fill="#94a3b8" font-size="10.5" text-anchor="middle">Shared safely across all CPU threads</text>

  <!-- Arrow B -> C -->
  <line x1="714" y1="320" x2="738" y2="320" stroke="#34d399" stroke-width="2.6" marker-end="url(#mG)"/>

  <!-- =================================================================== -->
  <!-- CARD C: INSTANT SELECTIVE RESET (x=744..1060, y=94..568)            -->
  <!-- =================================================================== -->
  <rect x="744" y="94" width="316" height="474" rx="10" fill="#0d1526" stroke="#1f2f46" stroke-width="1.2"/>
  <text x="902" y="120" fill="#a7f3d0" font-size="13.5" font-weight="700" text-anchor="middle">C. Instant Reset for Next Board</text>
  <text x="902" y="139" fill="#94a3b8" font-size="11" text-anchor="middle">Erase only the checklist rows we actually ticked</text>

  <!-- Slow full wipe visual -->
  <g transform="translate(762, 154)">
    <rect x="0" y="0" width="280" height="106" rx="8" fill="#241218" stroke="#7f1d1d"/>
    <text x="140" y="21" fill="#fca5a5" font-size="11.5" font-weight="700" text-anchor="middle">Slow way: wipe ALL 2,168 rows (17 KB)</text>
    <!-- Dense grid of tiny blocks -->
    <g transform="translate(18, 32)">
      <rect x="0" y="0" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="18" y="0" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="36" y="0" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="54" y="0" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="72" y="0" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="90" y="0" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="108" y="0" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="126" y="0" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="144" y="0" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="162" y="0" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="180" y="0" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="198" y="0" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="216" y="0" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="234" y="0" width="14" height="14" rx="2" fill="#7f1d1d"/>
      <rect x="0" y="18" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="18" y="18" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="36" y="18" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="54" y="18" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="72" y="18" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="90" y="18" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="108" y="18" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="126" y="18" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="144" y="18" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="162" y="18" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="180" y="18" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="198" y="18" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="216" y="18" width="14" height="14" rx="2" fill="#7f1d1d"/><rect x="234" y="18" width="14" height="14" rx="2" fill="#7f1d1d"/>
    </g>
    <text x="140" y="88" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Wastes time zeroing ~98% already-empty rows!</text>
  </g>

  <!-- Fast selective reset visual -->
  <g transform="translate(762, 276)" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">
    <rect x="0" y="0" width="280" height="272" rx="8" fill="#082a23" stroke="#34d399" stroke-width="1.6"/>
    <text x="140" y="24" fill="#ecfdf5" font-size="12" font-family="'Segoe UI', Inter, sans-serif">Fast way: zero ONLY touched rows!</text>
    <text x="140" y="42" fill="#a7f3d0" font-size="10.5" font-family="'Segoe UI', Inter, sans-serif" font-weight="600">We already know which word IDs we found</text>

    <!-- Before row (only 2 touched blocks!) -->
    <g transform="translate(18, 58)" font-size="11">
      <rect x="0" y="0" width="36" height="30" rx="4" fill="#172133" stroke="#334155"/><text x="18" y="20" fill="#64748b">0</text>
      <rect x="42" y="0" width="36" height="30" rx="4" fill="#431407" stroke="#fb923c" stroke-width="1.6"/><text x="60" y="20" fill="#fed7aa">■</text>
      <rect x="84" y="0" width="36" height="30" rx="4" fill="#172133" stroke="#334155"/><text x="102" y="20" fill="#64748b">0</text>
      <rect x="126" y="0" width="36" height="30" rx="4" fill="#172133" stroke="#334155"/><text x="144" y="20" fill="#64748b">0</text>
      <rect x="168" y="0" width="36" height="30" rx="4" fill="#431407" stroke="#fb923c" stroke-width="1.6"/><text x="186" y="20" fill="#fed7aa">■</text>
      <rect x="210" y="0" width="36" height="30" rx="4" fill="#172133" stroke="#334155"/><text x="228" y="20" fill="#64748b">0</text>
    </g>

    <!-- Selective arrows down -->
    <line x1="78" y1="90" x2="78" y2="116" stroke="#34d399" stroke-width="2.2" marker-end="url(#mG)"/>
    <line x1="204" y1="90" x2="204" y2="116" stroke="#34d399" stroke-width="2.2" marker-end="url(#mG)"/>

    <rect x="18" y="120" width="244" height="30" rx="6" fill="#064e3b" stroke="#34d399"/>
    <text x="140" y="139" fill="#ecfdf5" font-size="11.5">bits[word_id &gt;&gt; 6] = 0</text>

    <line x1="78" y1="150" x2="78" y2="174" stroke="#34d399" stroke-width="2.2" marker-end="url(#mG)"/>
    <line x1="204" y1="150" x2="204" y2="174" stroke="#34d399" stroke-width="2.2" marker-end="url(#mG)"/>

    <!-- After row (all zeros!) -->
    <g transform="translate(18, 178)" font-size="11">
      <rect x="0" y="0" width="36" height="28" rx="4" fill="#172133" stroke="#334155"/><text x="18" y="19" fill="#64748b">0</text>
      <rect x="42" y="0" width="36" height="28" rx="4" fill="#0b2e26" stroke="#34d399"/><text x="60" y="19" fill="#34d399">0</text>
      <rect x="84" y="0" width="36" height="28" rx="4" fill="#172133" stroke="#334155"/><text x="102" y="19" fill="#64748b">0</text>
      <rect x="126" y="0" width="36" height="28" rx="4" fill="#172133" stroke="#334155"/><text x="144" y="19" fill="#64748b">0</text>
      <rect x="168" y="0" width="36" height="28" rx="4" fill="#0b2e26" stroke="#34d399"/><text x="186" y="19" fill="#34d399">0</text>
      <rect x="210" y="0" width="36" height="28" rx="4" fill="#172133" stroke="#334155"/><text x="228" y="19" fill="#64748b">0</text>
    </g>

    <text x="140" y="232" fill="#a7f3d0" font-size="11" font-family="'Segoe UI', Inter, sans-serif">Clears ~30 rows instead of 2,168!</text>
    <text x="140" y="251" fill="#6ee7b7" font-size="10.5" font-family="'Segoe UI', Inter, sans-serif" font-weight="600">Ready for Board #2 in nanoseconds ✓</text>
  </g>

  <!-- Bottom Takeaway Bar -->
  <rect x="20" y="582" width="1040" height="42" rx="8" fill="#111a2c" stroke="#263449"/>
  <text x="38" y="608" fill="#34d399" font-size="12.5" font-weight="700">Why it's fast:</text>
  <text x="132" y="608" fill="#cbd5e1" font-size="12.5">One-pass bitset dedup, zero string copies, and selective cleanup keep 1-million-board runs screaming fast.</text>
  <rect x="826" y="591" width="220" height="24" rx="12" fill="#251349" stroke="#7c3aed"/>
  <text x="936" y="607" fill="#e9d5ff" font-size="10.5" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">1-bit dedup · zero-copy views</text>
</svg>
