<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="100%" height="100%" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111a2c"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b2e26"/>
      <stop offset="100%" stop-color="#162847"/>
    </linearGradient>
    <marker id="mG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker>
    <marker id="mY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="mP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/></marker>
  </defs>

  <!-- Canvas -->
  <rect width="1080" height="640" rx="14" fill="url(#bg)" stroke="#263449" stroke-width="2"/>

  <!-- Header + 6-Stage Stepper -->
  <rect x="20" y="16" width="1040" height="64" rx="10" fill="url(#hdr)" stroke="#1f5143" stroke-width="1.2"/>
  <circle cx="48" cy="48" r="15" fill="#059669"/><text x="48" y="54" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">5</text>
  <text x="74" y="43" fill="#f8fafc" font-size="18.5" font-weight="700">Stage 5 · Two-Slot Bit Scan &amp; Pointerless Dictionary Jump</text>
  <text x="74" y="64" fill="#94a3b8" font-size="12">Leap straight over zeros to the lit moves, then count dictionary switches to find each child's ID without storing pointers.</text>

  <!-- 6-Stage Progress Stepper -->
  <g transform="translate(836, 37)" font-size="11" font-weight="700" text-anchor="middle">
    <line x1="12" y1="11" x2="188" y2="11" stroke="#334155" stroke-width="2"/>
    <circle cx="12" cy="11" r="10" fill="#0c2f4f" stroke="#38bdf8"/><text x="12" y="15" fill="#7dd3fc">1</text>
    <circle cx="47" cy="11" r="10" fill="#2b1b08" stroke="#fbbf24"/><text x="47" y="15" fill="#fde68a">2</text>
    <circle cx="82" cy="11" r="10" fill="#0c2f4f" stroke="#38bdf8"/><text x="82" y="15" fill="#7dd3fc">3</text>
    <circle cx="117" cy="11" r="10" fill="#0c2f4f" stroke="#38bdf8"/><text x="117" y="15" fill="#7dd3fc">4</text>
    <circle cx="152" cy="11" r="11" fill="#059669" stroke="#a7f3d0" stroke-width="1.6"/><text x="152" y="15" fill="#fff">5</text>
    <circle cx="187" cy="11" r="10" fill="#172133" stroke="#475569"/><text x="187" y="15" fill="#64748b">6</text>
  </g>

  <!-- =================================================================== -->
  <!-- TOP BAND: PART A — TWO-SLOT BIT SCAN (y=92..326)                    -->
  <!-- =================================================================== -->
  <rect x="20" y="92" width="1040" height="234" rx="10" fill="#0d1526" stroke="#1f2f46" stroke-width="1.2"/>
  <text x="38" y="114" fill="#6ee7b7" font-size="13" font-weight="700">A. Jump straight to lit moves (skip all empty zeros — no 16-step loop!)</text>
  <text x="38" y="133" fill="#94a3b8" font-size="11.5">Most surviving paths have only 1 or 2 legal moves, so we handle two slots straight-line without any loop branches.</text>

  <!-- Slot 1 (x=38..330) -->
  <g transform="translate(38, 148)" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">
    <text x="142" y="12" fill="#a7f3d0" font-size="12" font-family="'Segoe UI', Inter, sans-serif">Slot 1 — Jump to 1st lit bit</text>

    <g transform="translate(6, 52)" font-size="12">
      <rect x="0" y="0" width="34" height="30" fill="#172133" stroke="#334155"/><text x="17" y="20" fill="#64748b">0</text><text x="17" y="45" fill="#64748b" font-size="10.5">0</text>
      <rect x="34" y="0" width="34" height="30" fill="#172133" stroke="#334155"/><text x="51" y="20" fill="#64748b">0</text><text x="51" y="45" fill="#64748b" font-size="10.5">1</text>
      <rect x="68" y="0" width="34" height="30" fill="#10b981" stroke="#fff" stroke-width="1.8"/><text x="85" y="20" fill="#022c22">1</text><text x="85" y="45" fill="#34d399" font-size="10.5">2:T</text>
      <rect x="102" y="0" width="34" height="30" fill="#172133" stroke="#334155"/><text x="119" y="20" fill="#64748b">0</text><text x="119" y="45" fill="#64748b" font-size="10.5">3</text>
      <rect x="136" y="0" width="34" height="30" fill="#172133" stroke="#334155"/><text x="153" y="20" fill="#64748b">0</text><text x="153" y="45" fill="#64748b" font-size="10.5">4</text>
      <rect x="170" y="0" width="34" height="30" fill="#065f46" stroke="#34d399"/><text x="187" y="20" fill="#a7f3d0">1</text><text x="187" y="45" fill="#34d399" font-size="10.5">5:R</text>
      <rect x="204" y="0" width="34" height="30" fill="#172133" stroke="#334155"/><text x="221" y="20" fill="#64748b">0</text><text x="221" y="45" fill="#64748b" font-size="10.5">6</text>
      <rect x="238" y="0" width="34" height="30" fill="#172133" stroke="#334155"/><text x="255" y="20" fill="#64748b">0</text><text x="255" y="45" fill="#64748b" font-size="10.5">7</text>

      <path d="M 17 -2 Q 51 -24 85 -2" fill="none" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#mY)"/>
      <text x="166" y="-11" fill="#fde68a" font-size="11">tzcnt(keep) = 2</text>
    </g>

    <rect x="6" y="110" width="272" height="28" rx="5" fill="#0b2e26" stroke="#34d399"/>
    <text x="142" y="128" fill="#ecfdf5" font-size="11.5">1st move found → tile @2 ('T')</text>
    <text x="142" y="154" fill="#64748b" font-size="10.5" font-family="'Segoe UI', Inter, sans-serif" font-weight="600">Leaps over zeros in 1 CPU cycle</text>
  </g>

  <!-- Erase bit 2 bridge (blsr) -->
  <g transform="translate(326, 198)" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">
    <line x1="2" y1="18" x2="88" y2="18" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#mY)"/>
    <rect x="4" y="30" width="84" height="44" rx="6" fill="#3b1d07" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="46" y="47" fill="#fef3c7" font-size="11">Erase bit 2</text>
    <text x="46" y="64" fill="#fde68a" font-size="10">k &amp; (k−1)</text>
  </g>

  <!-- Slot 2 (x=422..714) -->
  <g transform="translate(422, 148)" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">
    <text x="142" y="12" fill="#a7f3d0" font-size="12" font-family="'Segoe UI', Inter, sans-serif">Slot 2 — Jump to 2nd lit bit</text>

    <g transform="translate(6, 52)" font-size="12">
      <rect x="0" y="0" width="34" height="30" fill="#172133" stroke="#334155"/><text x="17" y="20" fill="#64748b">0</text><text x="17" y="45" fill="#64748b" font-size="10.5">0</text>
      <rect x="34" y="0" width="34" height="30" fill="#172133" stroke="#334155"/><text x="51" y="20" fill="#64748b">0</text><text x="51" y="45" fill="#64748b" font-size="10.5">1</text>
      <rect x="68" y="0" width="34" height="30" fill="#3f1219" stroke="#f87171"/>
      <text x="85" y="20" fill="#f87171">0</text>
      <line x1="72" y1="26" x2="98" y2="4" stroke="#f87171" stroke-width="2"/>
      <text x="85" y="45" fill="#f87171" font-size="10.5">2✕</text>
      <rect x="102" y="0" width="34" height="30" fill="#172133" stroke="#334155"/><text x="119" y="20" fill="#64748b">0</text><text x="119" y="45" fill="#64748b" font-size="10.5">3</text>
      <rect x="136" y="0" width="34" height="30" fill="#172133" stroke="#334155"/><text x="153" y="20" fill="#64748b">0</text><text x="153" y="45" fill="#64748b" font-size="10.5">4</text>
      <rect x="170" y="0" width="34" height="30" fill="#10b981" stroke="#fff" stroke-width="1.8"/><text x="187" y="20" fill="#022c22">1</text><text x="187" y="45" fill="#34d399" font-size="10.5">5:R</text>
      <rect x="204" y="0" width="34" height="30" fill="#172133" stroke="#334155"/><text x="221" y="20" fill="#64748b">0</text><text x="221" y="45" fill="#64748b" font-size="10.5">6</text>
      <rect x="238" y="0" width="34" height="30" fill="#172133" stroke="#334155"/><text x="255" y="20" fill="#64748b">0</text><text x="255" y="45" fill="#64748b" font-size="10.5">7</text>

      <path d="M 17 -2 Q 102 -22 187 -2" fill="none" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#mY)"/>
      <text x="102" y="-17" fill="#fde68a" font-size="11">tzcnt(k1) = 5</text>
    </g>

    <rect x="6" y="110" width="272" height="28" rx="5" fill="#0b2e26" stroke="#34d399"/>
    <text x="142" y="128" fill="#ecfdf5" font-size="11.5">2nd move found → tile @5 ('R')</text>
    <text x="142" y="154" fill="#fde68a" font-size="10.5">advance += 1 + (k1 != 0)  (no branch)</text>
  </g>

  <line x1="726" y1="148" x2="726" y2="310" stroke="#1e293b" stroke-width="1.5"/>

  <!-- What if 3+ moves? (x=742..1044) -->
  <g transform="translate(742, 148)" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">
    <text x="150" y="12" fill="#fde68a" font-size="12" font-family="'Segoe UI', Inter, sans-serif">What if 3+ moves lit up?</text>
    <text x="150" y="30" fill="#94a3b8" font-size="10.5" font-family="'Segoe UI', Inter, sans-serif" font-weight="600">Erase bit 5 → any bit left (k2)?</text>

    <rect x="0" y="44" width="144" height="28" rx="5" fill="#0b2e26" stroke="#34d399"/>
    <text x="72" y="62" fill="#a7f3d0" font-size="11">k2 == 0 → Done ✓</text>

    <rect x="154" y="44" width="146" height="28" rx="5" fill="#3b1d07" stroke="#fbbf24"/>
    <text x="227" y="62" fill="#fef3c7" font-size="11">k2 != 0 → Keep ↻</text>

    <!-- Visual in-place compaction strip -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="28" height="28" rx="4" fill="#0b2e26" stroke="#34d399"/><text x="14" y="19" fill="#6ee7b7" font-size="12">✓</text>
      <rect x="31" y="0" width="28" height="28" rx="4" fill="#78350f" stroke="#fbbf24"/><text x="45" y="19" fill="#fef3c7" font-size="12">↻</text>
      <rect x="62" y="0" width="28" height="28" rx="4" fill="#0b2e26" stroke="#34d399"/><text x="76" y="19" fill="#6ee7b7" font-size="12">✓</text>
      <rect x="93" y="0" width="28" height="28" rx="4" fill="#78350f" stroke="#fbbf24"/><text x="107" y="19" fill="#fef3c7" font-size="12">↻</text>

      <line x1="126" y1="14" x2="148" y2="14" stroke="#fbbf24" stroke-width="2" marker-end="url(#mY)"/>

      <rect x="154" y="0" width="28" height="28" rx="4" fill="#78350f" stroke="#fbbf24"/><text x="168" y="19" fill="#fef3c7" font-size="12">↻</text>
      <rect x="185" y="0" width="28" height="28" rx="4" fill="#78350f" stroke="#fbbf24"/><text x="199" y="19" fill="#fef3c7" font-size="12">↻</text>

      <line x1="218" y1="14" x2="236" y2="14" stroke="#fbbf24" stroke-width="2" marker-end="url(#mY)"/>

      <rect x="242" y="0" width="58" height="28" rx="5" fill="#78350f" stroke="#fbbf24"/>
      <text x="271" y="19" fill="#fef3c7" font-size="10.5">↻ S1</text>
    </g>

    <text x="150" y="138" fill="#94a3b8" font-size="10.5" font-family="'Segoe UI', Inter, sans-serif" font-weight="600">Slides leftover paths together in-place</text>
    <text x="150" y="154" fill="#64748b" font-size="10" font-family="'Segoe UI', Inter, sans-serif" font-weight="600">&amp; runs Slots 1–2 again (0 branches!)</text>
  </g>

  <!-- =================================================================== -->
  <!-- BOTTOM BAND: PART B — POINTERLESS CHILD ID VIA COUNTING SWITCHES    -->
  <!-- =================================================================== -->
  <rect x="20" y="338" width="1040" height="232" rx="10" fill="#0d1526" stroke="#1f2f46" stroke-width="1.2"/>
  <text x="38" y="362" fill="#6ee7b7" font-size="13" font-weight="700">B. How do we find the child's dictionary page without storing 26 pointers?</text>
  <text x="38" y="381" fill="#94a3b8" font-size="11.5">All children of #45 ("CA") sit packed side-by-side starting at #100 in alphabetical order. Just count how many ON switches come before the letter!</text>

  <!-- Left: Packed Bookshelf (x=38..288) -->
  <g transform="translate(38, 396)" font-family="Consolas, monospace" font-weight="700">
    <text x="122" y="12" fill="#7dd3fc" font-size="11.5" font-family="'Segoe UI', Inter, sans-serif" text-anchor="middle">Packed Bookshelf (first_child = #100)</text>

    <rect x="0" y="24" width="244" height="32" rx="5" fill="#172133" stroke="#475569"/>
    <text x="14" y="45" fill="#94a3b8" font-size="11.5">100 + 0</text>
    <text x="92" y="45" fill="#cbd5e1" font-size="12">#100  "CAB" ★</text>

    <rect x="0" y="64" width="244" height="32" rx="5" fill="#0b2e26" stroke="#34d399"/>
    <text x="14" y="85" fill="#6ee7b7" font-size="11.5">100 + 1</text>
    <text x="92" y="85" fill="#ecfdf5" font-size="12">#101  "CAR" ★</text>

    <rect x="0" y="104" width="244" height="32" rx="5" fill="#0b2e26" stroke="#34d399"/>
    <text x="14" y="125" fill="#6ee7b7" font-size="11.5">100 + 2</text>
    <text x="92" y="125" fill="#ecfdf5" font-size="12">#102  "CAT" ★</text>

    <text x="122" y="156" fill="#64748b" font-size="10.5" font-family="'Segoe UI', Inter, sans-serif" font-weight="600" text-anchor="middle">Zero wasted slots for missing letters!</text>
  </g>

  <line x1="302" y1="398" x2="302" y2="554" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Middle: Count Switches Before Letter (x=320..736) -->
  <g transform="translate(320, 396)" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">
    <text x="206" y="12" fill="#fde68a" font-size="11.5" font-family="'Segoe UI', Inter, sans-serif">Count ON switches to the left (1 CPU instruction: popcnt)</text>

    <!-- Row 1: For 'T' -->
    <g transform="translate(0, 26)" font-size="11.5">
      <rect x="0" y="0" width="214" height="52" rx="6" fill="#3b1d07" fill-opacity="0.55" stroke="#fbbf24" stroke-dasharray="3,2"/>
      <text x="107" y="15" fill="#fde68a" font-size="10">switches before 'T' (A..S)</text>

      <rect x="10" y="22" width="32" height="22" fill="#0d1526" stroke="#475569"/><text x="26" y="37" fill="#64748b">A</text>
      <rect x="46" y="22" width="38" height="22" fill="#10b981" stroke="#fff"/><text x="65" y="37" fill="#022c22">B●</text>
      <rect x="88" y="22" width="30" height="22" fill="#0d1526" stroke="#475569"/><text x="103" y="37" fill="#64748b">··</text>
      <rect x="122" y="22" width="38" height="22" fill="#10b981" stroke="#fff"/><text x="141" y="37" fill="#022c22">R●</text>
      <rect x="164" y="22" width="38" height="22" fill="#0d1526" stroke="#475569"/><text x="183" y="37" fill="#64748b">S</text>

      <rect x="222" y="22" width="34" height="22" fill="#0284c7" stroke="#bae6fd"/><text x="239" y="37" fill="#fff">T</text>

      <line x1="262" y1="33" x2="290" y2="33" stroke="#34d399" stroke-width="2.2" marker-end="url(#mG)"/>
      <text x="354" y="15" fill="#34d399" font-size="10.5">2 ON (B, R)</text>
      <rect x="296" y="21" width="116" height="26" rx="5" fill="#065f46" stroke="#34d399"/>
      <text x="354" y="38" fill="#fff" font-size="11.5">100 + 2 = #102</text>
    </g>

    <!-- Row 2: For 'R' -->
    <g transform="translate(0, 92)" font-size="11.5">
      <rect x="0" y="0" width="130" height="52" rx="6" fill="#3b1d07" fill-opacity="0.55" stroke="#fbbf24" stroke-dasharray="3,2"/>
      <text x="65" y="15" fill="#fde68a" font-size="10">before 'R' (A..Q)</text>

      <rect x="10" y="22" width="32" height="22" fill="#0d1526" stroke="#475569"/><text x="26" y="37" fill="#64748b">A</text>
      <rect x="46" y="22" width="38" height="22" fill="#10b981" stroke="#fff"/><text x="65" y="37" fill="#022c22">B●</text>
      <rect x="88" y="22" width="32" height="22" fill="#0d1526" stroke="#475569"/><text x="104" y="37" fill="#64748b">··</text>

      <rect x="138" y="22" width="34" height="22" fill="#0284c7" stroke="#bae6fd"/><text x="155" y="37" fill="#fff">R</text>
      <rect x="176" y="22" width="32" height="22" fill="#0d1526" stroke="#475569"/><text x="192" y="37" fill="#64748b">S</text>
      <rect x="212" y="22" width="32" height="22" fill="#0d1526" stroke="#475569"/><text x="228" y="37" fill="#64748b">T</text>

      <line x1="252" y1="33" x2="290" y2="33" stroke="#34d399" stroke-width="2.2" marker-end="url(#mG)"/>
      <text x="354" y="15" fill="#34d399" font-size="10.5">1 ON (B only)</text>
      <rect x="296" y="21" width="116" height="26" rx="5" fill="#065f46" stroke="#34d399"/>
      <text x="354" y="38" fill="#fff" font-size="11.5">100 + 1 = #101</text>
    </g>
  </g>

  <!-- Arrow Middle -> Right -->
  <line x1="744" y1="478" x2="774" y2="478" stroke="#c084fc" stroke-width="2.4" marker-end="url(#mP)"/>

  <!-- Right: Save New 64-Bit Tickets to Level-3 Queue (x=782..1044) -->
  <g transform="translate(782, 396)" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">
    <text x="131" y="12" fill="#e9d5ff" font-size="11.5" font-family="'Segoe UI', Inter, sans-serif">Write New Level-3 Tickets</text>

    <rect x="0" y="26" width="262" height="44" rx="6" fill="#0b2e26" stroke="#34d399" stroke-width="1.5"/>
    <text x="131" y="45" fill="#fff" font-size="12">#102 "CAT" ★   @2</text>
    <text x="131" y="62" fill="#6ee7b7" font-size="10">visited {0,1,2} · 1 × 64-bit write</text>

    <rect x="0" y="78" width="262" height="44" rx="6" fill="#0b2e26" stroke="#34d399" stroke-width="1.5"/>
    <text x="131" y="97" fill="#fff" font-size="12">#101 "CAR" ★   @5</text>
    <text x="131" y="114" fill="#6ee7b7" font-size="10">visited {0,1,5} · 1 × 64-bit write</text>

    <rect x="0" y="132" width="262" height="28" rx="14" fill="#162847" stroke="#38bdf8" stroke-opacity="0.7"/>
    <text x="131" y="150" fill="#e0f2fe" font-size="10.5" font-family="'Segoe UI', Inter, sans-serif">↻ Repeat Stages 3–5 until queue empty</text>
  </g>

  <!-- Bottom Takeaway Bar -->
  <rect x="20" y="582" width="1040" height="42" rx="8" fill="#111a2c" stroke="#263449"/>
  <text x="38" y="608" fill="#34d399" font-size="12.5" font-weight="700">Why it's fast:</text>
  <text x="132" y="608" fill="#cbd5e1" font-size="12.5">Hardware bit-ops jump straight to valid moves and compute child IDs with zero branches or pointers.</text>
  <rect x="814" y="591" width="232" height="24" rx="12" fill="#0b2e26" stroke="#10b981"/>
  <text x="930" y="607" fill="#a7f3d0" font-size="10.5" font-family="Consolas, monospace" font-weight="700" text-anchor="middle">tzcnt + blsr + popcnt · CELL_PACKED</text>
</svg>
